<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Happy Birthday 🎂</title>
<meta name="description" content="เว็บอวยพรวันเกิดแบบพิเศษ" />
<meta name="theme-color" content="#FFF3E9" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
</head>
<body>

<!-- ชั้นพื้นหลัง: ก้อนสีพาสเทล + ดาวระยิบ -->
<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="stars" id="stars"></div>
</div>

<!-- รูปลอยผ่านด้านหลัง (โผล่หลังเป่าเทียนเสร็จ) -->
<div class="drift-layer" id="drift-layer"></div>

<!-- confetti / พลุ -->
<canvas id="confetti-canvas"></canvas>

<!-- ปุ่มเปิด-ปิดเพลง -->
<button id="music-btn" class="music-btn" aria-label="เปิด/ปิดเพลง" title="เปิด/ปิดเพลง" hidden>
  <span class="music-icon"><i></i><i></i><i></i><i></i></span>
</button>

<main id="stage">

  <!-- ─────────── ฉาก 1: กล่องของขวัญ ─────────── -->
  <section class="scene is-active" id="scene-gift">
    <div class="scene-inner">
      <p class="eyebrow" id="gift-eyebrow">มีบางอย่างรออยู่ตรงนี้</p>

      <div class="gift-wrap">
        <button class="gift" id="gift" aria-label="เปิดกล่องของขวัญ">
          <span class="gift-glow"></span>
          <span class="gift-lid">
            <span class="gift-lid-band"></span>
            <span class="gift-bow">
              <span class="bow-l"></span><span class="bow-r"></span><span class="bow-knot"></span>
            </span>
          </span>
          <span class="gift-box"><span class="gift-band"></span></span>
          <span class="gift-shadow"></span>
        </button>
      </div>

      <p class="hint pulse" id="gift-hint">แตะกล่องเลย 🎁</p>
    </div>
  </section>

  <!-- ─────────── ฉาก 2: คำอวยพร ─────────── -->
  <section class="scene" id="scene-wish">

    <!-- ของตกแต่ง — ยึดกับทั้งหน้าจอ ไม่ใช่แค่กรอบข้อความ -->
    <div class="decor" id="wish-decor" aria-hidden="true">
      <figure class="decor-photo dp-1"><img alt="" /></figure>
      <figure class="decor-photo dp-2"><img alt="" /></figure>
      <span class="decor-emo de-1">🎈</span>
      <span class="decor-emo de-2">🎀</span>
      <span class="decor-emo de-3">🎂</span>
      <span class="decor-emo de-4">✦</span>
      <span class="decor-emo de-5">✧</span>
    </div>

    <div class="scene-inner">
      <p class="eyebrow">Happy Birthday</p>
      <h1 class="title">
        <span class="title-deco">✦</span>
        <span id="name-text"></span>
        <span class="title-deco">✦</span>
      </h1>

      <div class="card wish-card">
        <span class="card-corner cc-tl"></span>
        <span class="card-corner cc-br"></span>
        <p class="wish-text" id="wish-text"></p>
        <span class="caret" id="wish-caret" aria-hidden="true"></span>
      </div>

      <button class="btn next-btn" data-next hidden>Next 📸</button>
    </div>
  </section>

  <!-- ─────────── ฉาก 3: รูปกระจายทั้งหน้า ─────────── -->
  <section class="scene" id="scene-photos">
    <div class="scene-inner widest">
      <p class="eyebrow">ความน่ารักที่ผ่านมา</p>
      <h2 class="subtitle">.. 📷</h2>

      <div class="collage" id="collage"><!-- JS ใส่รูปให้ --></div>

      <button class="btn next-btn" data-next>Next 🕯️</button>
    </div>
  </section>

  <!-- ─────────── ฉาก 4: เค้ก + เป่าเทียน (ฉากจบ) ─────────── -->
  <section class="scene" id="scene-cake">
    <div class="veil" id="veil"></div>

    <div class="scene-inner">
      <div class="cake-head" id="cake-head">
        <p class="eyebrow">อธิษฐานได้เลย</p>
        <h2 class="subtitle" id="cake-title">เป่าเทียนให้ครบทุกเล่ม 🕯️</h2>
      </div>

      <div class="cake-area" id="cake-area">
        <span class="spotlight"></span>
        <div class="cake">
          <div class="candles" id="candles"><!-- JS ใส่เทียนให้ --></div>
          <div class="cake-top"></div>
          <div class="cake-layer layer-1">
            <span class="drip"></span><span class="drip"></span><span class="drip"></span>
            <span class="drip"></span><span class="drip"></span>
          </div>
          <div class="cake-layer layer-2"></div>
          <div class="cake-plate"></div>
        </div>
      </div>

      <p class="hint pulse lit" id="cake-hint">ลากนิ้ว / เมาส์ผ่านเปลวเทียน 💨</p>

      <div class="wish-reveal" id="wish-reveal" hidden>
        <p class="wish-granted" id="wish-granted"></p>
        <p class="ending-note" id="ending-note"></p>
        <button class="btn ghost" id="replay-btn"> ↺ </button>
      </div>
    </div>
  </section>

</main>

<!-- ดูรูปแบบขยาย -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="ปิด">✕</button>
  <button class="lb-arrow prev" id="lb-prev" aria-label="รูปก่อนหน้า">‹</button>
  <figure class="lb-frame">
    <img id="lb-img" alt="" />
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-arrow next" id="lb-next" aria-label="รูปถัดไป">›</button>
</div>

<audio id="bgm" loop preload="none"></audio>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
